<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Finanças pessoais</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside>
      <h1>Finanças</h1>
      <nav>
        <button class="active" data-page="dashboard">Visão geral</button
        ><button data-page="salary">Salário</button
        ><button data-page="investments">Investimentos</button
        ><button data-page="records">Movimentações e contas</button>
      </nav>
      <button id="export" class="secondary">Exportar dados</button>
    </aside>
    <main>
      <header>
        <div>
          <small>CONTROLE FINANCEIRO</small>
          <h2 id="heading">Visão geral</h2>
        </div>
        <button id="add" class="primary">Adicionar</button>
      </header>
      <section id="content"></section>
    </main>
    <dialog id="modal">
      <form id="form">
        <h3 id="formTitle"></h3>
        <div id="formFields"></div>
        <footer>
          <button type="button" id="cancel">Cancelar</button
          ><button class="primary">Salvar</button>
        </footer>
      </form>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
